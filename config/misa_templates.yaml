# Cấu trúc cột file Excel nhập khẩu vào MISA SME.NET.
# Khi nhập (Tệp > Nhập khẩu từ Excel), MISA cho phép "ghép cột" và lưu cấu hình ghép, nên tên cột
# ở đây KHÔNG bắt buộc trùng 100% với mẫu của MISA. Tuy vậy nếu muốn khớp hoàn toàn, hãy mở MISA,
# tải mẫu nhập khẩu rồi sửa lại tên cột dưới đây cho giống.
