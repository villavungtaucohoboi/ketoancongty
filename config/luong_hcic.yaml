# Cập nhật bảng lương theo FILE MẪU CỦA CÔNG TY.
# App KHÔNG đổi công thức/hệ số đang có. App chỉ:
#  (1) chép số liệu chấm công sang các ô nhập tay của sheet "Bảng lương" (khớp theo họ tên),
#  (2) ô công thức nào bị TRỐNG thì điền lại theo bộ công thức chuẩn (config/luong_cong_thuc.yaml),
#  (3) BHXH / công đoàn / phụ cấp đang TRỐNG thì lấy từ sheet "Phụ cấp",
#  (4) đổi tiêu đề tháng, cập nhật bảng tổng hợp.
# Vùng dòng của từng khối được TỰ NHẬN DIỆN theo nhãn "Khối văn phòng", "Thực tập sinh", "Khối thi công".
sheet_bang_luong: "Bảng lương"
sheet_cham_cong: "Chấm công + đánh giá hiệu quả"
sheet_tong_hop: "BANG TONG HOP"
sheet_phu_cap: "Phụ cấp"
dong_bat_dau_cham_cong: 6

# Cột Bảng lương <- cột Chấm công, theo khối (vp = văn phòng, tts = thực tập sinh, tc = thi công)
anh_xa:
  vp:  {E: T, F: Q, J: I, L: S, Q: J, S: K, U: L}
  tts: {E: T, F: Q, J: I, L: S, Q: J, S: K, U: L}
  tc:  {E: T, F: Q, J: I, L: S, Q: M, S: N, U: L}   # Q, S khối thi công = số buổi trước / sau 21h

# Cột Bảng lương <- cột sheet Phụ cấp (chỉ điền khi ô đang trống)
tu_phu_cap: {O: M, P: N, Z: L}

tieu_de:
  - ["Bảng lương", "K3"]
  - ["BANG TONG HOP", "A3"]

# Bảng tổng hợp: dòng 5..7 cột C trỏ tới tổng thực nhận từng khối; khi sang tháng mới,
# cột E (tháng trước) nhận số cũ đó. Ô nguồn được đọc từ chính công thức cột C.
tong_hop:
  o_thang_nay: "C4"
  o_thang_truoc: "E4"
  dong: [5, 6, 7]
  cot_nay: "C"
  cot_truoc: "E"

cot_ket_qua: {"Công thực tế": "F", "Lương Gross": "AA", "Thực nhận": "AD"}
