    - tu_khoa: ["PHI CHUYEN TIEN", "PHI QUAN LY TK", "PHI DICH VU", "PHI SMS", "PHI THUONG NIEN"]
      loai: chi
      tk_doi_ung: "6428"
      khoan_muc: "phí ngân hàng"
    - tu_khoa: ["LAI TIEN GUI", "TRA LAI", "LAI NHAP GOC"]
      loai: thu
      tk_doi_ung: "515"
    - tu_khoa: ["NOP THUE", "NSNN", "KHO BAC", "THUE GTGT", "THUE TNDN"]
      loai: chi
      tk_doi_ung: "3331"
    - tu_khoa: ["BHXH", "BAO HIEM XA HOI"]
      loai: chi
      tk_doi_ung: "3383"
    - tu_khoa: ["LUONG", "TIEN LUONG", "THANH TOAN LUONG"]
      loai: chi
      tk_doi_ung: "334"
    - tu_khoa: ["RUT TIEN MAT", "RUT TM"]
      loai: chi
      tk_doi_ung: "1111"
    - tu_khoa: ["NOP TIEN MAT", "NOP TM"]
      loai: thu
